<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="UI Gallery calendar component schematic">
  <rect width="1200" height="750" fill="#0b0d10"/>

  <text x="64" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="4" fill="#5f6875">CALENDAR</text>
  <text x="64" y="128" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1" fill="#f4f6f8">MONTH VIEW</text>

  <!-- view switcher -->
  <g>
    <rect x="900" y="76" width="76" height="38" rx="19" fill="#ff5f1f"/>
    <text x="938" y="101" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#0b0d10">M</text>
    <rect x="986" y="76" width="76" height="38" rx="19" fill="none" stroke="#2b313a"/>
    <text x="1024" y="101" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#5f6875">W</text>
    <rect x="1072" y="76" width="64" height="38" rx="19" fill="none" stroke="#2b313a"/>
    <text x="1104" y="101" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#5f6875">D</text>
  </g>

  <!-- weekday header -->
  <g fill="#5f6875" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2">
    <text x="90" y="192">MON</text>
    <text x="244" y="192">TUE</text>
    <text x="398" y="192">WED</text>
    <text x="552" y="192">THU</text>
    <text x="706" y="192">FRI</text>
    <text x="860" y="192">SAT</text>
    <text x="1014" y="192">SUN</text>
  </g>

  <!-- grid -->
  <g stroke="#1f232a" stroke-width="1">
    <rect x="64" y="212" width="1072" height="480" fill="#0e1014"/>
    <line x1="217" y1="212" x2="217" y2="692"/>
    <line x1="370" y1="212" x2="370" y2="692"/>
    <line x1="523" y1="212" x2="523" y2="692"/>
    <line x1="676" y1="212" x2="676" y2="692"/>
    <line x1="829" y1="212" x2="829" y2="692"/>
    <line x1="982" y1="212" x2="982" y2="692"/>
    <line x1="64" y1="332" x2="1136" y2="332"/>
    <line x1="64" y1="452" x2="1136" y2="452"/>
    <line x1="64" y1="572" x2="1136" y2="572"/>
  </g>

  <!-- day numbers -->
  <g fill="#5f6875" font-family="ui-monospace, monospace" font-size="13">
    <text x="80" y="236">01</text><text x="233" y="236">02</text><text x="386" y="236">03</text>
    <text x="539" y="236">04</text><text x="692" y="236">05</text><text x="845" y="236">06</text><text x="998" y="236">07</text>
    <text x="80" y="356">08</text><text x="233" y="356">09</text><text x="386" y="356">10</text>
    <text x="539" y="356">11</text><text x="692" y="356">12</text><text x="845" y="356">13</text><text x="998" y="356">14</text>
    <text x="80" y="476">15</text><text x="233" y="476">16</text><text x="386" y="476">17</text>
    <text x="539" y="476">18</text><text x="692" y="476">19</text><text x="845" y="476">20</text><text x="998" y="476">21</text>
    <text x="80" y="596">22</text><text x="233" y="596">23</text><text x="386" y="596">24</text>
    <text x="539" y="596">25</text><text x="692" y="596">26</text><text x="845" y="596">27</text><text x="998" y="596">28</text>
  </g>

  <!-- today marker -->
  <circle cx="700" cy="345" r="16" fill="#ff5f1f" opacity="0.16"/>

  <!-- multi-day event bars -->
  <rect x="76" y="250" width="440" height="26" rx="4" fill="#ff5f1f"/>
  <text x="90" y="269" font-family="ui-monospace, monospace" font-size="14" fill="#0b0d10">Sprint review</text>

  <rect x="535" y="250" width="290" height="26" rx="4" fill="#2b313a"/>

  <rect x="229" y="370" width="595" height="26" rx="4" fill="#69e8b4" opacity="0.85"/>
  <text x="243" y="389" font-family="ui-monospace, monospace" font-size="14" fill="#0b0d10">Release window</text>

  <rect x="76" y="404" width="285" height="22" rx="4" fill="#1f232a"/>
  <rect x="688" y="490" width="290" height="26" rx="4" fill="#ff5f1f" opacity="0.55"/>
  <rect x="382" y="490" width="130" height="22" rx="4" fill="#1f232a"/>
  <rect x="76" y="610" width="440" height="26" rx="4" fill="#2b313a"/>
  <rect x="841" y="610" width="130" height="22" rx="4" fill="#1f232a"/>

  <!-- drag handle hint -->
  <g opacity="0.9">
    <rect x="688" y="490" width="4" height="26" fill="#f4f6f8"/>
    <rect x="974" y="490" width="4" height="26" fill="#f4f6f8"/>
  </g>
</svg>
